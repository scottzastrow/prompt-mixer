<!DOCTYPE html>
<!--
  Project: Prompt Mixer
  Author: Scott Zastrow
  Course: SEIS 606 — University of St. Thomas
  Description: Single-page UI for assembling prompts from a raw prompt plus optional context, role, and constraints, then generating and comparing AI responses.
  Copyright (c) 2026 Scott Zastrow
  SPDX-License-Identifier: MIT
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prompt Mixer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="header">
        <div class="header-row">
          <h1>Prompt Mixer</h1>
          <div class="header-controls">
            <div class="preset-picker">
              <label for="preset-select" data-i18n="examples">Examples</label>
              <div class="preset-controls">
                <select id="preset-select" aria-label="Choose a preset">
                  <option value="" data-i18n="choosePreset">Choose a preset</option>
                  <option value="one" data-i18n="presetOne">Preset 1 · Day hike</option>
                  <option value="two" data-i18n="presetTwo">Preset 2 · Variables</option>
                  <option value="three" data-i18n="presetThree">Preset 3 · Friendly reminder</option>
                </select>
                <button id="clear-button" type="button" aria-label="Clear all fields and results" data-i18n="clear">Clear</button>
              </div>
            </div>
            <div class="language-picker">
              <label for="language-select" data-i18n="language">Language</label>
              <select id="language-select" aria-label="Choose interface language">
                <option value="en">English</option>
                <option value="ja">日本語</option>
              </select>
            </div>
          </div>
        </div>
        <p data-i18n="intro">Choose a preset or write your own prompt. The combined prompt updates live as you type or change selections.</p>
      </header>

      <div class="divider"></div>

      <form id="prompt-form" novalidate>
        <section class="field-block required-block">
          <div class="field-header">
            <label for="raw-prompt" data-i18n="rawPrompt">Raw prompt</label>
            <span data-i18n="alwaysIncluded">Always included</span>
          </div>
          <textarea id="raw-prompt" name="rawPrompt" placeholder="Enter your raw prompt" data-i18n-placeholder="rawPlaceholder" required></textarea>
        </section>

        <section class="optional-field">
          <div class="toggle-row">
            <label class="checkbox-label">
              <input id="include-context" type="checkbox" />
              <span class="checkbox-box" aria-hidden="true"></span>
              <span data-i18n="context">Context</span>
            </label>
          </div>
          <textarea id="context-input" name="context" placeholder="Add context to include" data-i18n-placeholder="contextPlaceholder"></textarea>
        </section>

        <section class="optional-field">
          <div class="toggle-row">
            <label class="checkbox-label">
              <input id="include-role" type="checkbox" />
              <span class="checkbox-box" aria-hidden="true"></span>
              <span data-i18n="role">Role</span>
            </label>
          </div>
          <textarea id="role-input" name="role" placeholder="Add a role or perspective" data-i18n-placeholder="rolePlaceholder"></textarea>
        </section>

        <section class="optional-field">
          <div class="toggle-row">
            <label class="checkbox-label">
              <input id="include-constraints" type="checkbox" />
              <span class="checkbox-box" aria-hidden="true"></span>
              <span data-i18n="constraints">Constraints</span>
            </label>
          </div>
          <textarea id="constraints-input" name="constraints" placeholder="Define constraints or style guidance" data-i18n-placeholder="constraintsPlaceholder"></textarea>
        </section>

      </form>

      <section class="output-section" aria-live="polite">
        <h2 data-i18n="combinedPrompt">Combined prompt</h2>
        <div class="output-box" id="output-box">
          <p id="output-text" data-i18n="ready">Ready to mix</p>
        </div>
      </section>
      <div class="actions">
        <button id="generate-response" type="button" class="generate-button" data-i18n="generate">Generate Response</button>
      </div>
      <section class="response-section" aria-live="polite" aria-busy="false">
        <h2 data-i18n="comparison">Response comparison</h2>
        <p id="response-status" role="status" data-i18n="initialStatus">Generate a response to compare the effect of your selected instructions.</p>
        <div id="response-cards" class="response-cards" hidden></div>
      </section>
    </main>

    <script src="/pdfmake.min.js"></script>
    <script src="/vfs_fonts.js"></script>
    <script type="module" src="script.js"></script>
  </body>
</html>
