<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000">
<rect width="1200" height="1000" fill="#f7f8fb"/>
<rect x="200" y="40" width="800" height="920" rx="20" fill="white" stroke="#dee2e9"/>
<text x="250" y="99" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#242631">Prompt Mixer</text>
<text x="250" y="131" font-family="Arial,sans-serif" font-size="15" fill="#666d7c">See how context and instructions change a prompt</text>
<line x1="250" x2="950" y1="157" y2="157" stroke="#e1e4ea"/>
<text x="250" y="195" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#242631">Raw prompt</text>
<text x="250" y="217" font-family="Arial,sans-serif" font-size="13" fill="#717887">Always included</text>
<rect x="250" y="232" width="700" height="92" rx="10" fill="#fff" stroke="#c9ced8" stroke-width="2"/>
<text x="270" y="271" font-family="Arial,sans-serif" font-size="17" fill="#303542">Explain recursion.</text>
<rect x="250" y="355" width="22" height="22" rx="4" fill="#5855d6"/>
<path d="M255 365l5 5 9-11" fill="none" stroke="white" stroke-width="2.5"/>
<text x="287" y="373" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#242631">Context</text>
<rect x="250" y="389" width="700" height="78" rx="10" fill="#fff" stroke="#c9ced8" stroke-width="2"/>
<text x="270" y="422" font-family="Arial,sans-serif" font-size="16" fill="#303542">I am new to programming and understand loops.</text>
<rect x="250" y="495" width="22" height="22" rx="4" fill="#5855d6"/>
<path d="M255 505l5 5 9-11" fill="none" stroke="white" stroke-width="2.5"/>
<text x="287" y="513" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#242631">Role</text>
<rect x="250" y="529" width="700" height="78" rx="10" fill="#fff" stroke="#c9ced8" stroke-width="2"/>
<text x="270" y="562" font-family="Arial,sans-serif" font-size="16" fill="#303542">Act as a patient programming instructor.</text>
<rect x="250" y="635" width="22" height="22" rx="4" fill="#5855d6"/>
<path d="M255 645l5 5 9-11" fill="none" stroke="white" stroke-width="2.5"/>
<text x="287" y="653" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#242631">Constraints</text>
<rect x="250" y="669" width="700" height="78" rx="10" fill="#fff" stroke="#c9ced8" stroke-width="2"/>
<text x="270" y="702" font-family="Arial,sans-serif" font-size="16" fill="#303542">Use a simple analogy and one short Python example.</text>
<rect x="250" y="777" width="700" height="48" rx="10" fill="#5855d6"/>
<text x="600" y="807" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="white">Show Mix</text>
<text x="250" y="865" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#242631">Combined prompt</text>
<rect x="250" y="882" width="700" height="48" rx="9" fill="#f2f1ff" stroke="#d8d6fa"/>
<text x="267" y="911" font-family="Arial,sans-serif" font-size="14" fill="#46439a">Raw + Context + Role + Constraints  ·  Ready to copy</text>
</svg>
